# Default values for jupyterbook-pub-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: quay.io/agoose77/jupyterbook-pub-service
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.0-0.dev.git.27.h7118edd"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: false
  annotations: {}
  ingressClassName:
  hosts: []
  pathSuffix:
  pathType: Prefix
  tls: []

service:
  type: ClusterIP
  port: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

securityContext: &securityContext
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false

podSecurityContext: &podSecurityContext
  runAsUser: 1000
  runAsGroup: 1000

# RBAC resource
rbac:
  create: true

# ServiceAccount resource
serviceAccount:
  create: true
  name: ""
  annotations: {}

auth:
  oauth_client_id: service-jupyterbook-pub
  enabled: true
  hub_api_token:
  hub_api_url:

volumeClaim:
  enabled: true
  size: 2G
  annotations: {}
  accessModes:
    - ReadWriteOnce

# Volume definition (excluding name) that is used in place of the build volume claim
volume:

extraVolumes: []
extraVolumeMounts: []

# Builder config
extraBuildConfig:

config:
  JupyterBookPubApp:
    port: 9200
    base_url: /
  KubernetesExecutor:
    # Security of builder
    security_context: *securityContext
    pod_security_context: *podSecurityContext

extraConfig: {}
resources: {}
