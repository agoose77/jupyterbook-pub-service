{{- /*
  Changes to this rendered manifest triggers a restart of the jupyterbook_pub
  pod as the pod specification includes an annotation with a checksum of this.
*/ -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "jupyterbook-pub-service.app.fullname" . }}
  labels:
    {{- include "jupyterbook-pub-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    Specify chart-derived config. This should only be config that requires Helm templates, or should be tied between builder and main app
  */}}
  builtin-chart-config.py: |
    import json

    # App config
    c.JupyterBookPubApp.executor_class = "jupyterbook_pub.executor.KubernetesExecutor"
    c.JupyterBookPubApp.storage_root = "/srv"

    # KubernetesExecutor config
    {{- if .Values.extraBuildConfig }}
    c.KubernetesExecutor.builder_config_secret = {{ print (include "jupyterbook-pub-service.app.fullname" .) "-builder" | quote }}
    c.KubernetesExecutor.builder_config_name = {{ .Values.extraBuildConfig.name | quote }}
    {{- end }}

    # Storage used by the main app
    c.KubernetesExecutor.storage_volume = json.loads(
      {{ include "jupyterbook-pub-service.storageVolume" . | fromYaml | mustToJson | quote }}
    )
    # Release namespace
    c.KubernetesExecutor.namespace = {{ .Release.Namespace | quote }}
  
    # Forward image_pull_secrets from main app because they're associated with the image, and we're forwarding that
    c.KubernetesExecutor.image = {{ (print .Values.image.repository ":" (.Values.image.tag | default .Chart.AppVersion)) | quote }}
    c.KubernetesExecutor.image_pull_secrets = json.loads(
      {{ .Values.image.pullSecrets | mustToJson | quote }}
    )
    # Labels used by the build pods
    c.KubernetesExecutor.labels = json.loads(
      {{ include "jupyterbook-pub-service.buildLabels" . | fromYaml | mustToJson | quote }}
    )

  {{- /*
    To restart the jupyterbook_pub pod only when relevant, we pick out the
    chart configuration actually consumed in the mounted jupyterbook_pub_config.py
    file.
  */}}
  chart-config.yaml: |
    {{- pick .Values "custom" "config" "extraConfig" | toYaml | nindent 4 }}

  {{- /* Glob files to allow them to be mounted by the jupyterbook_pub pod */}}
  {{- /* key=filename: value=content */}}
  {{- (.Files.Glob "mounted-files/*").AsConfig | nindent 2 }}
