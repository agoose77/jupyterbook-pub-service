apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jupyterbook-pub-service.app.fullname" . }}
  labels:
    {{- include "jupyterbook-pub-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "jupyterbook-pub-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        # Depend upon secret
        checksum/mounted-secret: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jupyterbook-pub-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "jupyterbook-pub-service.app.serviceaccount.fullname" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      initContainers:
        # Ensure we have write access to the storage
        - name: "volume-mount-ownership-fix"
          image: "busybox:1.36.1"
          command:
            - "sh"
            - "-c"
            - "id && chown 1000:1000 /srv"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: "/srv"
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

#           startupProbe:
#             periodSeconds: 1
#             failureThreshold: 60
#             httpGet:
#               path: {{ .Values.config.JupyterBookPubApp.base_url | trimSuffix "/" }}/
#               port: http
          env:
            - name: JUPYTERHUB_SERVICE_PREFIX
              value: {{ .Values.config.JupyterBookPubApp.base_url | quote }}
            - name: JUPYTERHUB_API_TOKEN
              value: {{ .Values.auth.hub_api_token | quote }}
            - name: JUPYTERHUB_CLIENT_ID
              value: {{ .Values.auth.oauth_client_id | quote }}
            - name: JUPYTERHUB_API_URL
              value: {{ .Values.auth.hub_api_url | quote }}
            {{- if not .Values.auth.enabled }}
            - name: JUPYTERBOOK_PUB_NO_AUTH
              value: "1"            
            {{- end }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}  
          args:
            - "python"
            - "-m"
            - "jupyterbook_pub.app"
            - "--config"
            - "/etc/jupyterbook.pub/mounted-secret/jupyterbook_pub_config.py"
          ports:
            - name: http
              containerPort: {{ .Values.config.JupyterBookPubApp.port }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: secret
              mountPath: /etc/jupyterbook.pub/mounted-secret/
              readOnly: true
            - name: storage
              mountPath: "/srv"
            {{- with .Values.extraVolumeMounts }}
            {{- tpl (. | toYaml) $ | nindent 12 }}
            {{- end }}
      volumes:
        - name: secret
          secret:
            secretName: {{ include "jupyterbook-pub-service.app.fullname" . }}
        - name: storage
          {{ include "jupyterbook-pub-service.storageVolume" . | nindent 10 }}
        {{- with .Values.extraVolumes }}
        {{- tpl (. | toYaml) $ | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
